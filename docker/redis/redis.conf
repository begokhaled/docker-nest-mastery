# ==============================================================================
# Redis Configuration for Docker & Production Readiness
# ==============================================================================

# Network binding
bind 0.0.0.0
protected-mode no
port 6379

# Password authentication (matched with REDIS_PASSWORD in .env)
requirepass redis_secure_password

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence: RDB (Snapshotting)
save 900 1
save 300 10
save 60 10000

# Persistence: AOF (Append Only File - durability)
appendonly yes
appendfsync everysec

# Performance & Logging
loglevel notice
timeout 0
tcp-keepalive 300
