version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci
      - npm run build
      - npm prune --omit=dev
run:
  command: node dist/main.js
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: API_PREFIX
      value: api/v1
