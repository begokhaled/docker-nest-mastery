# ==============================================================================
# DOCKER COMPOSE - DEVELOPMENT ENVIRONMENT
# ==============================================================================
# Usage:
#   docker compose up --build
#   docker compose down
#
# Features:
#   - Hot-reload via nodemon (live source mount: ./src -> /usr/src/app/src)
#   - Database ports exposed to host for GUI tools (DBeaver, Compass, RedisInsight)
#   - Healthy-check dependencies: 'api' waits until Postgres, Mongo & Redis are ready
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nest_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-nest_docker_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_user} -d ${POSTGRES_DB:-nest_docker_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # 2. MongoDB Document Database Service
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: nest_mongo_dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-mongo_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secure_password}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-nest_mongo_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # 3. Redis In-Memory Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nest_redis_dev
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - app_network

  # ----------------------------------------------------------------------------
  # 4. NestJS Application Service (Development Target)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: nest_api_dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-3000}:3000"
      - "9229:9229" # Node.js inspector port for Chrome DevTools / VSCode debugging
    volumes:
      # Live-mount source code for nodemon hot-reload
      - ./src:/usr/src/app/src:ro
      - ./nodemon.json:/usr/src/app/nodemon.json:ro
      # Preserve container node_modules from being overwritten by host
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network

# ------------------------------------------------------------------------------
# NETWORKS & VOLUMES
# ------------------------------------------------------------------------------
networks:
  app_network:
    driver: bridge
    name: nest_app_network

volumes:
  postgres_data:
    name: nest_postgres_data
  mongo_data:
    name: nest_mongo_data
  redis_data:
    name: nest_redis_data
