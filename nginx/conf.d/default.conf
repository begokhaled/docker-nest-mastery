upstream nestjs_upstream {
    # 'api' is the Docker Compose service name for the NestJS container
    server api:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Client Request Limits
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx native liveness probe
    location /healthz {
        access_log off;
        return 200 '{"status":"UP","proxy":"nginx"}';
        add_header Content-Type application/json;
    }

    # Proxy all traffic to NestJS backend upstream
    location / {
        # Rate limit protection (allows burst of up to 40 requests without delay)
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn addr_limit 50;

        proxy_pass http://nestjs_upstream;
        proxy_http_version 1.1;

        # WebSockets and Keep-Alive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
